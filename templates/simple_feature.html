{% extends "base.html" %}

{% block content %}
<section class="hero">
    <h1>{{ hero_title }}</h1>
    <p>{{ hero_subtitle }}</p>
</section>

<section class="features">
    {% for card in cards %}
    <div class="card">
        <h3>{{ card.title }}</h3>
        <p>{{ card.text }}</p>
    </div>
    {% endfor %}
</section>
{% endblock %}
