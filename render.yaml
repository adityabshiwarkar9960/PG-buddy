services:
  - type: web
    name: pgbuddy
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 3 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: LOG_LEVEL
        value: "info"
    envSecrets:
      - key: PG_BUDDY_SECRET
